[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeuctivity"
version = "0.1.0"
description = "LoRA fine-tuned CodeT5 for code summarization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.18",
    "wandb>=0.17",
    "evaluate>=0.4",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "ipykernel>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codeuctivity"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
